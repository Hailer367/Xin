<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1115;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      .container {
        text-align: center;
      }
      .code {
        font-size: 10rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        background: linear-gradient(120deg, #ff6b6b, #ff4757);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .title {
        font-size: 1.5rem;
        margin-top: 1.5rem;
        color: #b0b7c3;
      }
      .desc {
        margin-top: 0.75rem;
        color: #6b7280;
        font-size: 1rem;
      }
      .line {
        width: 6rem;
        height: 2px;
        background: #ff4757;
        margin: 2rem auto;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <hr class="line" />
      <div class="title">Page Not Found</div>
      <p class="desc">The page you are looking for doesn&rsquo;t exist.</p>
    </div>
  </body>
</html>
